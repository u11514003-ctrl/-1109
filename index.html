<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1917">
<title>mnanak na qalang｜泰雅原住民電子繪本</title>
<style>
:root{color-scheme:dark;--bg:#1c1917;--panel:#292524;--line:#78350f;--gold:#f59e0b;--soft:#fde68a;--text:#f5f5f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(12px,3vw,28px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#44403c 0,var(--bg) 58%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.container{width:min(100%,960px);padding:clamp(16px,3vw,28px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 60px #0008}
h1{text-align:center;color:var(--gold);font-size:clamp(20px,4vw,30px);line-height:1.35;margin:0 0 8px}
.subtitle{text-align:center;color:#d6d3d1;font-size:14px;margin:0 0 20px}
.book-stage{position:relative;width:100%;aspect-ratio:4/3;max-height:68vh;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0c0a09;border:3px solid #57534e;border-radius:12px}
.book-stage img{display:block;width:100%;height:100%;object-fit:contain}
.page-tag{position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#000c;color:var(--soft);font:600 14px ui-monospace,monospace}
.loading{position:absolute;left:12px;bottom:12px;padding:6px 10px;border-radius:8px;background:#000b;color:#fff;font-size:13px}
.desc-box{margin:16px 0;padding:16px;background:#1c1917;border:1px solid #57534e;border-radius:12px;min-height:90px}
.desc-box h2{margin:0 0 7px;color:#fbbf24;font-size:18px}
.desc-box p{margin:0;color:#e7e5e4;font-size:15px;line-height:1.75}
.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
button{min-height:44px;padding:11px 17px;border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s,background .15s}
button:hover:not(:disabled){filter:brightness(1.13);transform:translateY(-1px)}
button:focus-visible{outline:3px solid #fef3c7;outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-nav{background:#b45309;color:white}
.btn-speech{background:#047857;color:white}
.btn-speech.playing{background:#b91c1c}
.btn-music{background:#4338ca;color:white}
.btn-music.playing{background:#b91c1c}
.btn-mute{background:#57534e;color:white}
.status{min-height:24px;margin:12px 0 0;text-align:center;color:#d6d3d1;font-size:13px}
.hint{margin:12px 0 0;text-align:center;color:#a8a29e;font-size:12px;line-height:1.6}
@media(max-width:520px){body{padding:8px}.container{padding:13px;border-radius:14px}.book-stage{min-height:190px;aspect-ratio:3/4;max-height:58vh}.desc-box{padding:12px}.controls{gap:8px}button{flex:1 1 calc(50% - 8px);padding:10px 8px;font-size:13px}}
@media(orientation:landscape) and (max-height:520px){body{padding:8px}.container{max-width:900px}.book-stage{aspect-ratio:16/9;max-height:45vh;min-height:150px}.desc-box{margin:9px 0;padding:10px}.subtitle{margin-bottom:10px}}
</style>
</head>
<body>
<main class="container">
<h1>mnanak na qalang 泰雅原住民電子繪本</h1>
<p class="subtitle">跟著故事翻頁，聆聽每一頁的聲音</p>
<section class="book-stage" aria-label="繪本閱讀區">
<img id="book-img" src="./assets/graphics/0.jpg" alt="繪本第 1 頁" fetchpriority="high">
<div class="page-tag" id="page-num" aria-live="polite">1 / 20 頁</div>
<div class="loading" id="image-status" role="status" aria-live="polite">圖片載入中…</div>
</section>
<section class="desc-box" aria-live="polite">
<h2 id="page-title">1. 封面：mnanak na qalang</h2>
<p id="page-desc">繪本封面，勇士與配有面具的小戰士、山豬（mnanak na qalang）。</p>
</section>
<nav class="controls" aria-label="繪本控制">
<button class="btn-nav" id="btn-prev" type="button" disabled>上一頁</button>
<button class="btn-speech" id="btn-speech" type="button">播放語音朗讀</button>
<button class="btn-music" id="btn-music" type="button">播放背景音樂</button>
<button class="btn-mute" id="btn-mute" type="button" aria-pressed="false">🔊 靜音</button>
<button class="btn-nav" id="btn-next" type="button">下一頁</button>
</nav>
<audio id="page-narration" aria-label="頁面語音朗讀" preload="none"></audio>
<audio id="background-music" aria-label="背景音樂" preload="none" loop></audio>
<p class="status" id="audio-status" role="status" aria-live="polite">請按「播放背景音樂」開始聆聽。</p>
<p class="hint">鍵盤操作：← 上一頁　→ 下一頁　空白鍵：朗讀播放／暫停（按鍵時不會捲動頁面）</p>
</main>
<script>
"use strict";
const pages = [
{title:"1. 封面：mnanak na qalang",desc:"繪本封面，勇士與配有面具的小戰士、山豬（mnanak na qalang）。"},
{title:"2. 金黃小米田與雀鳥",desc:"廣袤金黃的小米田，雀鳥與田間的可愛小動物。"},
{title:"3. 樹下掛竹筒與祈禱",desc:"勇士與長老們在樹下祈禱，樹枝上掛著祭祀竹筒，夜空星光點點。"},
{title:"4. 夜間森林與貓頭鷹",desc:"夜間神祕森林，樹上貓頭鷹與暗處野狼目光，勇士與面具小人受到驚嚇。"},
{title:"5. 紅月下的神秘面具儀式",desc:"血紅月亮高懸，薩滿手持藍色火炬，部落面具戰士們圍繞聚會。"},
{title:"6. 森林探險與野莓",desc:"勇士手持獵刀帶領面具小戰士穿越綠色森林，樹叢結滿紅野莓。"},
{title:"7. 王座與獻花儀式",desc:"戴著高聳羽冠的面具領袖坐在座椅上，戴花的小女孩與部落族人歡慶。"},
{title:"8. 歡樂抓青蛙",desc:"勇士與面具小人們在黃昏稻田中歡樂捕捉綠色青蛙。"},
{title:"9. 驚險飲食體驗：蛇與昆蟲",desc:"宴席上面具人端上紫色毒蛇、大甲蟲與青蛙食物，勇士面露驚恐表情。"},
{title:"10. 烤野豬美饌",desc:"勇士大口享用香氣四溢的烤野豬肉，篝火上方煙霧繚繞。"},
{title:"11. 勇士被綑綁與審訊",desc:"勇士被黃色繩索綑綁在木柱上，持矛的面具小戰士與哭泣女孩包圍。"},
{title:"12. 長老賜予長矛與解綁",desc:"薩滿長老為勇士鬆開手腕繩索，並將一束獵矛交到他手中。"},
{title:"13. 糧倉休息與老婦人",desc:"勇士背著獵矛在乾草糧倉中沉睡休息，門口一位紋面老婦人關注著他。"},
{title:"14. 夢境／神秘儀式與精靈",desc:"夢境中光芒綻放，長老、面具孩子與綠色青蛙精靈聚集圍繞。"},
{title:"15. 森林狩獵山羌",desc:"勇士在紅褐色森林中快速奔跑，投擲獵矛追捕山羌。"},
{title:"16. 遇到村莊獵人與小孩",desc:"勇士在綠意盎然的樹林裡遇見部落獵人、小男孩與跟隨的小狗。"},
{title:"17. 篝火全豬宴",desc:"大火上架著一隻完整的烤野豬，獵人們在樹林中準備豐盛大餐。"},
{title:"18. 與面具孩子們道別",desc:"勇士單膝下跪，溫柔地握著面具小女孩的手，與孩子們親切道別。"},
{title:"19. 長老給予最終祝福與榮耀",desc:"長老撫摸勇士的頭部進行祝福儀式，周圍部落族人歡呼目送。"},
{title:"20. 山嶺老鷹翱翔與和平結尾",desc:"雄鷹在大山與針葉林上空翱翔，祥雲升起。勇士和部落的人們過著和諧、共榮的生活。"}
];
let currentIndex=0;
let musicEnabled=false;
let muted=false;
let speechActive=false;
let musicGeneration=0;
const img=document.getElementById("book-img");
const pageNum=document.getElementById("page-num");
const titleEl=document.getElementById("page-title");
const descEl=document.getElementById("page-desc");
const imageStatus=document.getElementById("image-status");
const audioStatus=document.getElementById("audio-status");
const prevBtn=document.getElementById("btn-prev");
const nextBtn=document.getElementById("btn-next");
const speechBtn=document.getElementById("btn-speech");
const musicBtn=document.getElementById("btn-music");
const muteBtn=document.getElementById("btn-mute");
const speechAudio=document.getElementById("page-narration");
const musicAudio=document.getElementById("background-music");
speechAudio.preload="auto";
musicAudio.preload="auto";
musicAudio.loop=true;
musicAudio.volume=0.28;
function setAudioStatus(message){audioStatus.textContent=message;}
function syncButtons(){
 speechBtn.textContent=speechActive?"暫停語音朗讀":"播放語音朗讀";
 speechBtn.classList.toggle("playing",speechActive);
 musicBtn.textContent=musicEnabled?(musicAudio.paused?"播放背景音樂":"暫停背景音樂"):"播放背景音樂";
 musicBtn.classList.toggle("playing",musicEnabled&&!musicAudio.paused);
 muteBtn.textContent=muted?"🔇 解除靜音":"🔊 靜音";
 muteBtn.setAttribute("aria-pressed",String(muted));
}
function stopSpeech(){
 speechAudio.pause();
 speechAudio.currentTime=0;
 speechActive=false;
 musicAudio.volume=muted?0:0.28;
 syncButtons();
}
function applyMusicVolume(){
 musicAudio.volume=muted?0:(speechActive?0.07:0.28);
}
function loadMusicForPage(shouldPlay){
 const generation=++musicGeneration;
 musicAudio.pause();
 musicAudio.src="./assets/music/music"+currentIndex+".mp3";
 musicAudio.loop=true;
 applyMusicVolume();
 musicAudio.load();
 if(shouldPlay){
  musicAudio.play().then(()=>{
   if(generation!==musicGeneration)return;
   syncButtons();
   setAudioStatus("背景音樂播放中。");
  }).catch(()=>{
   if(generation!==musicGeneration)return;
   setAudioStatus("背景音樂尚未播放，請再按一次播放背景音樂。");
   syncButtons();
  });
 }else{syncButtons();}
}
function preloadNextImage(){
 const next=currentIndex+1;
 if(next<pages.length){const preloader=new Image();preloader.src="./assets/graphics/"+next+".jpg";}
}
function showImage(){
 imageStatus.textContent="圖片載入中…";
 img.alt="繪本第 "+(currentIndex+1)+" 頁";
 img.src="./assets/graphics/"+currentIndex+".jpg";
}
img.addEventListener("load",()=>{imageStatus.textContent="圖片已載入";});
img.addEventListener("error",()=>{
 imageStatus.textContent="圖片載入失敗";
 const retry=document.createElement("button");
 retry.type="button";retry.textContent="重新載入圖片";retry.className="btn-nav";
 retry.addEventListener("click",()=>{retry.remove();showImage();});
 imageStatus.replaceChildren(document.createTextNode("圖片載入失敗 "),retry);
});
function updatePage(){
 pageNum.textContent=(currentIndex+1)+" / "+pages.length+" 頁";
 titleEl.textContent=pages[currentIndex].title;
 descEl.textContent=pages[currentIndex].desc;
 prevBtn.disabled=currentIndex===0;
 nextBtn.disabled=currentIndex===pages.length-1;
 showImage();
 preloadNextImage();
 speechAudio.pause();
 speechAudio.currentTime=0;
 speechAudio.src="./assets/speech/speech"+currentIndex+".mp3";
 speechActive=false;
 applyMusicVolume();
 if(musicEnabled)loadMusicForPage(true);else loadMusicForPage(false);
 syncButtons();
}
function changePage(direction){
 const next=Math.max(0,Math.min(pages.length-1,currentIndex+direction));
 if(next===currentIndex)return;
 currentIndex=next;
 updatePage();
}
function toggleSpeech(){
 if(speechActive&&!speechAudio.paused){speechAudio.pause();speechActive=false;applyMusicVolume();syncButtons();setAudioStatus("朗讀已暫停。");return;}
 speechAudio.play().then(()=>{
  speechActive=true;applyMusicVolume();syncButtons();setAudioStatus("本頁語音朗讀中，背景音樂已自動降低音量。");
 }).catch(()=>{
  speechActive=false;syncButtons();setAudioStatus("朗讀音訊載入失敗，請確認網路後再試。");
 });
}
function toggleMusic(){
 if(musicEnabled&&!musicAudio.paused){
  musicAudio.pause();musicEnabled=false;syncButtons();setAudioStatus("背景音樂已暫停。");return;
 }
 musicEnabled=true;
 if(!musicAudio.src||!musicAudio.src.endsWith("/music"+currentIndex+".mp3"))loadMusicForPage(false);
 applyMusicVolume();
 musicAudio.play().then(()=>{syncButtons();setAudioStatus("背景音樂播放中。");}).catch(()=>{
  musicEnabled=false;syncButtons();setAudioStatus("背景音樂無法播放，請再按一次，或檢查音樂檔案。");
 });
}
function toggleMute(){
 muted=!muted;
 applyMusicVolume();
 speechAudio.muted=muted;
 musicAudio.muted=muted;
 syncButtons();
 setAudioStatus(muted?"已靜音；朗讀與背景音樂都會保持靜音。":"已解除靜音。");
}
speechAudio.addEventListener("ended",()=>{
 speechActive=false;applyMusicVolume();syncButtons();setAudioStatus("本頁朗讀結束，背景音樂已恢復原音量。");
});
speechAudio.addEventListener("pause",()=>{if(speechAudio.ended)return;speechActive=false;applyMusicVolume();syncButtons();});
musicAudio.addEventListener("error",()=>{if(musicEnabled)setAudioStatus("背景音樂檔案載入失敗，請稍後重試。");});
prevBtn.addEventListener("click",()=>changePage(-1));
nextBtn.addEventListener("click",()=>changePage(1));
speechBtn.addEventListener("click",toggleSpeech);
musicBtn.addEventListener("click",toggleMusic);
muteBtn.addEventListener("click",toggleMute);
document.addEventListener("keydown",(event)=>{
 if(event.altKey||event.ctrlKey||event.metaKey)return;
 const target=event.target;
 const tag=target&&target.tagName?target.tagName.toLowerCase():"";
 if(tag==="input"||tag==="textarea"||tag==="select"||(target&&target.isContentEditable))return;
 if(event.key==="ArrowRight"){event.preventDefault();changePage(1);}
 else if(event.key==="ArrowLeft"){event.preventDefault();changePage(-1);}
 else if(event.code==="Space"||event.key===" "){
  event.preventDefault();
  if(!event.repeat)toggleSpeech();
 }
});
updatePage();
</script>
</body>
</html>

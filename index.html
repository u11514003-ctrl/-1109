<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mnanak na qalang 電子繪本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const pages = Array.from({ length: 20 }, (_, i) => ({
            id: i,
            image: `./assets/graphics/${i}.jpg`,
            imageAlt: `./assets/graphics/${i}.png`,
            imageUpper: `./assets/graphics/${i}.JPG`,
            music: i === 10 ? `./assets/music/music9_2.mp3` : `./assets/music/music${i}.mp3`,
            speech: `./assets/speech/speech${i}.mp3`
        }));

        function App() {
            const [currentPage, setCurrentPage] = useState(0);
            const [isPlayingSpeech, setIsPlayingSpeech] = useState(false);
            const [isPlayingMusic, setIsPlayingMusic] = useState(false);
            
            const speechRef = useRef(new Audio());
            const musicRef = useRef(new Audio());

            useEffect(() => {
                speechRef.current.src = pages[currentPage].speech;
                musicRef.current.src = pages[currentPage].music;
                musicRef.current.loop = true;

                if (isPlayingSpeech) speechRef.current.play().catch(() => {});
                if (isPlayingMusic) musicRef.current.play().catch(() => {});

                return () => {
                    speechRef.current.pause();
                    musicRef.current.pause();
                };
            }, [currentPage]);

            const toggleSpeech = () => {
                if (isPlayingSpeech) {
                    speechRef.current.pause();
                } else {
                    speechRef.current.play().catch(e => alert("音訊檔案尚未上傳或路徑不符"));
                }
                setIsPlayingSpeech(!isPlayingSpeech);
            };

            const toggleMusic = () => {
                if (isPlayingMusic) {
                    musicRef.current.pause();
                } else {
                    musicRef.current.play().catch(e => alert("背景音樂尚未上傳或路徑不符"));
                }
                setIsPlayingMusic(!isPlayingMusic);
            };

            const handleImgError = (e, page) => {
                if (e.target.src.endsWith('.jpg')) {
                    e.target.src = page.imageUpper;
                } else if (e.target.src.endsWith('.JPG')) {
                    e.target.src = page.imageAlt;
                }
            };

            return (
                <div class="max-w-4xl w-full bg-stone-800 rounded-xl shadow-2xl p-6 border border-amber-700/50 flex flex-col items-center">
                    <h1 class="text-2xl font-bold text-amber-500 mb-4">mnanak na qalang 繪本故事</h1>
                    
                    <div class="relative w-full aspect-[4/3] bg-stone-950 rounded-lg overflow-hidden border-4 border-amber-900/40 mb-6 flex items-center justify-center">
                        <img 
                            src={pages[currentPage].image} 
                            onError={(e) => handleImgError(e, pages[currentPage])}
                            alt={`第 ${currentPage + 1} 頁`} 
                            class="max-h-full max-w-full object-contain"
                        />
                        <div class="absolute bottom-3 right-3 bg-black/60 px-3 py-1 rounded text-xs text-amber-200">
                            頁次：{currentPage + 1} / 20
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-4 items-center justify-center mb-4">
                        <button 
                            onClick={() => setCurrentPage(prev => Math.max(0, prev - 1))}
                            disabled={currentPage === 0}
                            class="px-4 py-2 bg-amber-700 hover:bg-amber-600 disabled:opacity-50 text-white rounded-lg shadow font-medium"
                        >
                            上一頁
                        </button>
                        
                        <button 
                            onClick={toggleSpeech}
                            class={`px-4 py-2 rounded-lg shadow font-medium ${isPlayingSpeech ? 'bg-red-600' : 'bg-emerald-600 hover:bg-emerald-500'} text-white`}
                        >
                            {isPlayingSpeech ? '暫停朗讀' : '播放語音朗讀'}
                        </button>

                        <button 
                            onClick={toggleMusic}
                            class={`px-4 py-2 rounded-lg shadow font-medium ${isPlayingMusic ? 'bg-red-600' : 'bg-indigo-600 hover:bg-indigo-500'} text-white`}
                        >
                            {isPlayingMusic ? '暫停音樂' : '播放背景音樂'}
                        </button>

                        <button 
                            onClick={() => setCurrentPage(prev => Math.min(19, prev + 1))}
                            disabled={currentPage === 19}
                            class="px-4 py-2 bg-amber-700 hover:bg-amber-600 disabled:opacity-50 text-white rounded-lg shadow font-medium"
                        >
                            下一頁
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

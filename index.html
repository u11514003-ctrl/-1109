<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mnanak na qalang 繪本故事</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #1c1917; color: #f5f5f4; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 900px; background-color: #292524; border-radius: 16px; border: 2px solid #78350f; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { color: #f59e0b; text-align: center; font-size: 24px; margin-bottom: 16px; }
        .book-stage { position: relative; width: 100%; aspect-ratio: 4/3; background-color: #0c0a09; border-radius: 8px; border: 4px solid #451a03; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .book-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .page-tag { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.75); color: #fde68a; padding: 4px 12px; border-radius: 4px; font-size: 14px; font-family: monospace; }
        .desc-box { background-color: #1c1917; border: 1px solid #451a03; padding: 16px; border-radius: 8px; margin-bottom: 20px; min-height: 70px; }
        .desc-box h2 { color: #fbbf24; font-size: 18px; margin-bottom: 6px; }
        .desc-box p { color: #d6d3d1; font-size: 15px; line-height: 1.5; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
        button { padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; transition: all 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-nav { background-color: #b45309; color: white; }
        .btn-nav:hover:not(:disabled) { background-color: #d97706; }
        .btn-speech { background-color: #059669; color: white; }
        .btn-speech.playing { background-color: #dc2626; }
        .btn-music { background-color: #4f46e5; color: white; }
        .btn-music.playing { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>mnanak na qalang 泰雅原住民電子繪本</h1>

    <div class="book-stage">
        <img id="book-img" src="./assets/graphics/0.jpg" alt="繪本頁面" onerror="handleImgError(this)">
        <div class="page-tag" id="page-num">1 / 20 頁</div>
    </div>

    <div class="desc-box">
        <h2 id="page-title">1. 封面：mnanak na qalang</h2>
        <p id="page-desc">繪本封面，勇士與配有面具的小戰士、山豬（mnanak na qalang）。</p>
    </div>

    <div class="controls">
        <button class="btn-nav" id="btn-prev" onclick="changePage(-1)">上一頁</button>
        <button class="btn-speech" id="btn-speech" onclick="toggleSpeech()">播放語音朗讀</button>
        <button class="btn-music" id="btn-music" onclick="toggleMusic()">播放背景音樂</button>
        <button class="btn-nav" id="btn-next" onclick="changePage(1)">下一頁</button>
    </div>
</div>

<script>
    const pages = [
        { title: "1. 封面：mnanak na qalang", desc: "繪本封面，勇士與配有面具的小戰士、山豬（mnanak na qalang）。" },
        { title: "2. 金黃小米田與雀鳥", desc: "廣袤金黃的小米田，雀鳥與田間的可愛小動物。" },
        { title: "3. 樹下掛竹筒與祈禱", desc: "勇士與長老們在樹下祈禱，樹枝上掛著祭祀竹筒，夜空星光點點。" },
        { title: "4. 夜間森林與貓頭鷹", desc: "夜間神祕森林，樹上貓頭鷹與暗處野狼目光，勇士與面具小人受到驚嚇。" },
        { title: "5. 紅月下的神秘面具儀式", desc: "血紅月亮高懸，薩滿手持藍色火炬，部落面具戰士們圍繞聚會。" },
        { title: "6. 森林探險與野莓", desc: "勇士手持獵刀帶領面具小戰士穿越綠色森林，樹叢結滿紅野莓。" },
        { title: "7. 王座與獻花儀式", desc: "戴著高聳羽冠的面具領袖坐在座椅上，戴花的小女孩與部落族人歡慶。" },
        { title: "8. 歡樂抓青蛙", desc: "勇士與面具小人們在黃昏稻田中歡樂捕捉綠色青蛙。" },
        { title: "9. 驚險飲食體驗：蛇與昆蟲", desc: "宴席上面具人端上紫色毒蛇、大甲蟲與青蛙食物，勇士面露驚恐表情。" },
        { title: "10. 烤野豬美饌", desc: "勇士大口享用香氣四溢的烤野豬肉，篝火上方煙霧繚繞。" },
        { title: "11. 勇士被綑綁與審訊", desc: "勇士被黃色繩索綑綁在木柱上，持矛的面具小戰士與哭泣女孩包圍。" },
        { title: "12. 長老賜予長矛與解綁", desc: "薩滿長老為勇士鬆開手腕繩索，並將一束獵矛交到他手中。" },
        { title: "13. 糧倉休息與老婦人", desc: "勇士背著獵矛在乾草糧倉中沉睡休息，門口一位紋面老婦人關注著他。" },
        { title: "14. 夢境/神秘儀式與精靈", desc: "夢境中光芒綻放，長老、面具孩子與綠色青蛙精靈聚集圍繞。" },
        { title: "15. 森林狩獵山羌", desc: "勇士在紅褐色森林中快速奔跑，投擲獵矛追捕山羌。" },
        { title: "16. 遇到村莊獵人與小孩", desc: "勇士在綠意盎然的樹林裡遇見部落獵人、小男孩與跟隨的小狗。" },
        { title: "17. 篝火全豬宴", desc: "大火上架著一隻完整的烤野豬，獵人們在樹林中準備豐盛大餐。" },
        { title: "18. 與面具孩子們道別", desc: "勇士單膝下跪，溫柔地握著面具小女孩的手，與孩子們親切道別。" },
        { title: "19. 長老給予最終祝福與榮耀", desc: "長老撫摸勇士的頭部進行祝福儀式，周圍部落族人歡呼目送。" },
        { title: "20. 山嶺老鷹翱翔與和平結尾", desc: "雄鷹在大山與針葉林上空翱翔，祥雲升起。彼此，勇士和部落的人們過著和諧、共榮的生活。" }
    ];

    let currentIndex = 0;
    const speechAudio = new Audio();
    const musicAudio = new Audio();
    let isSpeechPlaying = false;
    let isMusicPlaying = false;

    function updatePage() {
        document.getElementById("book-img").src = `./assets/graphics/${currentIndex}.jpg`;
        document.getElementById("page-num").innerText = `${currentIndex + 1} / 20 頁`;
        document.getElementById("page-title").innerText = pages[currentIndex].title;
        document.getElementById("page-desc").innerText = pages[currentIndex].desc;

        document.getElementById("btn-prev").disabled = (currentIndex === 0);
        document.getElementById("btn-next").disabled = (currentIndex === 19);

        // 更新聲音來源
        speechAudio.src = `./assets/speech/speech${currentIndex}.mp3`;
        musicAudio.src = (currentIndex === 10) ? `./assets/music/music9_2.mp3` : `./assets/music/music${currentIndex}.mp3`;
        musicAudio.loop = true;

        if (isSpeechPlaying) speechAudio.play().catch(() => {});
        if (isMusicPlaying) musicAudio.play().catch(() => {});
    }

    function changePage(dir) {
        currentIndex = Math.min(Math.max(0, currentIndex + dir), 19);
        updatePage();
    }

    function toggleSpeech() {
        const btn = document.getElementById("btn-speech");
        if (isSpeechPlaying) {
            speechAudio.pause();
            btn.innerText = "播放語音朗讀";
            btn.classList.remove("playing");
            isSpeechPlaying = false;
        } else {
            speechAudio.play().then(() => {
                btn.innerText = "暫停語音";
                btn.classList.add("playing");
                isSpeechPlaying = true;
            }).catch(() => alert("語音檔載入中或未找到檔案"));
        }
    }

    function toggleMusic() {
        const btn = document.getElementById("btn-music");
        if (isMusicPlaying) {
            musicAudio.pause();
            btn.innerText = "播放背景音樂";
            btn.classList.remove("playing");
            isMusicPlaying = false;
        } else {
            musicAudio.play().then(() => {
                btn.innerText = "暫停音樂";
                btn.classList.add("playing");
                isMusicPlaying = true;
            }).catch(() => alert("音樂檔載入中或未找到檔案"));
        }
    }

    function handleImgError(img) {
        if (img.src.endsWith('.jpg')) {
            img.src = `./assets/graphics/${currentIndex}.JPG`;
        } else if (img.src.endsWith('.JPG')) {
            img.src = `./assets/graphics/${currentIndex}.png`;
        }
    }

    updatePage();
</script>
</body>
</html>

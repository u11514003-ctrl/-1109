<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mnanak na qalang - 原住民互動繪本電子書</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tribal: {
                            red: '#8B1E1E',
                            gold: '#D4AF37',
                            dark: '#1A0F0D',
                            cream: '#F4EBE1',
                            brown: '#4A2E1A',
                            accent: '#C85A32'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- React and Babel React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 原住民圖騰風格邊框與背景 */
        .pattern-bg {
            background-color: #1a0f0d;
            background-image: radial-gradient(#d4af37 0.75px, transparent 0.75px), radial-gradient(#8b1e1e 0.75px, #1a0f0d 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .tribal-border {
            border: 12px solid #8B1E1E;
            border-image: repeating-linear-gradient(45deg, #8B1E1E, #8B1E1E 15px, #D4AF37 15px, #D4AF37 30px, #1A0F0D 30px, #1A0F0D 45px) 20;
        }

        .book-shadow {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.25);
        }

        /* 真實 3D 雙頁書本翻頁動畫類別 */
        .perspective-2000 {
            perspective: 2500px;
        }

        .book-container {
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        .book-page-leaf {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            right: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .book-page-leaf.flipped {
            transform: rotateY(-180deg);
        }

        .page-front, .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        .page-back {
            transform: rotateY(180deg);
        }

        /* 書脊中線陰影 */
        .book-spine-shadow {
            background: linear-gradient(to right, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 10%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.1) 90%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        /* 客製化 scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1A0F0D;
        }
        ::-webkit-scrollbar-thumb {
            background: #8B1E1E;
            border-radius: 3px;
        }
    </style>
</head>
<body class="pattern-bg text-tribal-cream min-h-screen flex flex-col justify-between overflow-x-hidden font-sans select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 精確對應您提供的 20 個圖片、朗讀語音 (speech0-19)、講稿語音 (speech0-19) 以及配樂素材 (music0-music18, music9_2)
        const bookPages = [
            { id: 1, title: "1. 封面：mnanak na qalang", img: "0.jpg", desc: "繪本封面，勇士與配有面具的小戰士、山豬（mnanak na qalang）。", speech: "speech0.mp3", lecture: "speech0.mp3", music: "music0.mp3", musicDesc: "素材 28: 部落傳統打擊與吟唱風格" },
            { id: 2, title: "2. 金黃小米田與雀鳥", img: "1.jpg", desc: "廣袤金黃的小米田，雀鳥與田間歡快可愛的小動物。", speech: "speech1.mp3", lecture: "speech1.mp3", music: "music1.mp3", musicDesc: "素材 29: 輕柔笛聲與鳥鳴聲" },
            { id: 3, title: "3. 樹下掛竹筒與祈禱", img: "2.jpg", desc: "勇士與長老們在古樹下祈禱，樹枝上掛著祭祀用的竹筒。", speech: "speech2.mp3", lecture: "speech2.mp3", music: "music2.mp3", musicDesc: "素材 30: 寧靜夜間蟲鳴與蛙鳴背景" },
            { id: 4, title: "4. 夜間森林與貓頭鷹", img: "3.jpg", desc: "夜間神祕森林，樹上貓頭鷹與暗處野狼出沒，小戰士與勇士受驚。", speech: "speech3.mp3", lecture: "speech3.mp3", music: "music3.mp3", musicDesc: "素材 31: 富有張力與律動感的鼓點" },
            { id: 5, title: "5. 紅月下的神秘面具儀式", img: "4.jpg", desc: "血紅月亮高懸，薩滿手持藍色火炬，部落面具戰士圍繞聚會。", speech: "speech4.mp3", lecture: "speech4.mp3", music: "music4.mp3", musicDesc: "素材 32: 重低音部落戰鼓與火炬背景" },
            { id: 6, title: "6. 森林探險與野莓", img: "5.jpg", desc: "勇士手持獵刀帶領面具小戰士穿越綠色森林，採摘鮮紅野莓。", speech: "speech5.mp3", lecture: "speech5.mp3", music: "music5.mp3", musicDesc: "素材 33: 清脆竹笛與輕快樂音" },
            { id: 7, title: "7. 王座與獻花儀式", img: "6.jpg", desc: "戴著高聳羽冠的面具領袖坐在座椅上，戴花的小女孩與族人歡慶。", speech: "speech6.mp3", lecture: "speech6.mp3", music: "music6.mp3", musicDesc: "素材 34: 歡快打擊與兒童童謠節奏" },
            { id: 8, title: "8. 歡樂抓青蛙", img: "7.jpg", desc: "勇士與面具小人們在黃昏稻田中歡樂捕捉綠色青蛙。", speech: "speech7.mp3", lecture: "speech7.mp3", music: "music7.mp3", musicDesc: "素材 35: 節奏明快的木魚與快板" },
            { id: 9, title: "9. 驚險飲食體驗：蛇與昆蟲", img: "8.jpg", desc: "宴席上面具人端上紫色毒蛇、大甲蟲與青蛙，勇士面露驚恐。", speech: "speech8.mp3", lecture: "speech8.mp3", music: "music8.mp3", musicDesc: "素材 36: 活潑緊張的打擊樂句" },
            { id: 10, title: "10. 烤野豬美饌", img: "9.jpg", desc: "勇士大口享用香氣四溢的烤野豬肉，篝火上方煙霧繚繞。", speech: "speech9.mp3", lecture: "speech9.mp3", music: "music9.mp3", musicDesc: "素材 37: 熱情流暢的吉他與打擊樂" },
            { id: 11, title: "11. 勇士被綑綁與審訊", img: "10.jpg", desc: "勇士被繩索綑綁在木柱上，持矛的面具戰士齊聲喊 Rik-Rak-Rak-No!", speech: "speech10.mp3", lecture: "speech10.mp3", music: "music9_2.mp3", musicDesc: "素材 38/44: 嚴肅打擊踏步與齊聲口號" },
            { id: 12, title: "12. 長老賜予長矛與解綁", img: "11.jpg", desc: "薩滿長老為勇士鬆開手腕繩索，並將一束精製獵矛遞給他。", speech: "speech11.mp3", lecture: "speech11.mp3", music: "music10.mp3", musicDesc: "素材 40: 沉穩古典木吉他彈撥" },
            { id: 13, title: "13. 糧倉休息與老婦人", img: "12.jpg", desc: "勇士背著獵矛在乾草糧倉中沉睡休息，紋面老婦人溫柔關注。", speech: "speech12.mp3", lecture: "speech12.mp3", music: "music11.mp3", musicDesc: "素材 42: 溫馨悠揚的笛聲" },
            { id: 14, title: "14. 夢境/神秘儀式與精靈", img: "13.jpg", desc: "夢境中微光綻放，長老、面具孩子與綠色青蛙精靈聚集圍繞。", speech: "speech13.mp3", lecture: "speech13.mp3", music: "music12.mp3", musicDesc: "素材 39: 神聖空靈人聲哼唱與沙鈴" },
            { id: 15, title: "15. 森林狩獵山羌", img: "14.jpg", desc: "勇士在紅褐色森林中快速奔跑，投擲獵矛精準追捕山羌。", speech: "speech14.mp3", lecture: "speech14.mp3", music: "music13.mp3", musicDesc: "素材 47: 富有張力與動感的吉他彈撥" },
            { id: 16, title: "16. 遇到村莊獵人與小孩", img: "15.jpg", desc: "勇士在綠意盎然樹林裡遇見部落獵人、小男孩與跟隨的小狗。", speech: "speech15.mp3", lecture: "speech15.mp3", music: "music14.mp3", musicDesc: "素材 41: 清晨森林鳥鳴環境音" },
            { id: 17, title: "17. 篝火全豬宴", img: "16.jpg", desc: "大火上架著完整的烤野豬，獵人們在樹林準備香氣濃郁的盛宴。", speech: "speech16.mp3", lecture: "speech16.mp3", music: "music15.mp3", musicDesc: "素材 43: 活潑輕快烏克麗麗與打擊樂" },
            { id: 18, title: "18. 與面具孩子們道別", img: "17.jpg", desc: "勇士單膝下跪，溫柔握著面具小女孩的手與孩子們道別。", speech: "speech17.mp3", lecture: "speech17.mp3", music: "music16.mp3", musicDesc: "素材 45: 溫馨可愛的彈撥樂音" },
            { id: 19, title: "19. 長老給予最終祝福與榮耀", img: "18.jpg", desc: "長老撫摸勇士頭部進行祝福儀式，周圍部落族人歡呼目送。", speech: "speech18.mp3", lecture: "speech18.mp3", music: "music17.mp3", musicDesc: "素材 46: 輕鬆律動感節奏與口技" },
            { id: 20, title: "20. 山嶺老鷹翱翔與和平結尾", img: "19.jpg", desc: "雄鷹在大山與針葉林上空翱翔，勇士與部落和諧共榮。", speech: "speech19.mp3", lecture: "speech19.mp3", music: "music18.mp3", musicDesc: "素材 29: 悠揚空靈笛聲與遠方鳥鳴" }
        ];

        function App() {
            const [currentPage, setCurrentPage] = useState(0); // 0 到 19
            const [isAutoPlay, setIsAutoPlay] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            const [bgmVolume, setBgmVolume] = useState(0.5);
            const [voiceVolume, setVoiceVolume] = useState(0.9);
            const [isPlayingBgm, setIsPlayingBgm] = useState(false);
            const [isPlayingSpeech, setIsPlayingSpeech] = useState(false);
            const [isPlayingLecture, setIsPlayingLecture] = useState(false);
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [isFlipping, setIsFlipping] = useState(false);

            // 音訊 Audio Instance
            const bgmAudioRef = useRef(new Audio());
            const speechAudioRef = useRef(new Audio());
            const lectureAudioRef = useRef(new Audio());

            const pageData = bookPages[currentPage];
            const nextPageData = bookPages[Math.min(currentPage + 1, bookPages.length - 1)];

            // 初始化 Audio
            useEffect(() => {
                const bgm = bgmAudioRef.current;
                const speech = speechAudioRef.current;
                const lecture = lectureAudioRef.current;

                bgm.loop = true;

                bgm.onplay = () => setIsPlayingBgm(true);
                bgm.onpause = () => setIsPlayingBgm(false);

                speech.onplay = () => setIsPlayingSpeech(true);
                speech.onpause = () => setIsPlayingSpeech(false);

                lecture.onplay = () => setIsPlayingLecture(true);
                lecture.onpause = () => setIsPlayingLecture(false);

                speech.onended = () => {
                    setIsPlayingSpeech(false);
                    if (isAutoPlay && currentPage < bookPages.length - 1) {
                        setTimeout(() => {
                            changePage(currentPage + 1);
                        }, 1200);
                    }
                };

                return () => {
                    bgm.pause();
                    speech.pause();
                    lecture.pause();
                };
            }, [isAutoPlay, currentPage]);

            // 切換頁碼時更新聲訊
            useEffect(() => {
                const bgm = bgmAudioRef.current;
                const speech = speechAudioRef.current;
                const lecture = lectureAudioRef.current;

                bgm.src = `assets/audio/${pageData.music}`;
                speech.src = `assets/audio/${pageData.speech}`;
                lecture.src = `assets/audio/${pageData.lecture}`;

                bgm.volume = isMuted ? 0 : bgmVolume;
                speech.volume = isMuted ? 0 : voiceVolume;
                lecture.volume = isMuted ? 0 : voiceVolume;

                if (isPlayingBgm) {
                    bgm.play().catch(e => console.log("BGM 播放通知:", e));
                }
                if (isAutoPlay) {
                    speech.play().catch(e => console.log("Speech 播放通知:", e));
                }
            }, [currentPage]);

            // 音量調節
            useEffect(() => {
                bgmAudioRef.current.volume = isMuted ? 0 : bgmVolume;
                speechAudioRef.current.volume = isMuted ? 0 : voiceVolume;
                lectureAudioRef.current.volume = isMuted ? 0 : voiceVolume;
            }, [bgmVolume, voiceVolume, isMuted]);

            const changePage = (newPage) => {
                if (newPage === currentPage || newPage < 0 || newPage >= bookPages.length || isFlipping) return;
                setIsFlipping(true);
                setCurrentPage(newPage);
                setTimeout(() => {
                    setIsFlipping(false);
                }, 800);
            };

            const toggleBgm = () => {
                const bgm = bgmAudioRef.current;
                if (isPlayingBgm) {
                    bgm.pause();
                } else {
                    bgm.play().catch(e => console.log(e));
                }
            };

            const toggleSpeech = () => {
                const speech = speechAudioRef.current;
                if (isPlayingSpeech) {
                    speech.pause();
                } else {
                    lectureAudioRef.current.pause();
                    speech.play().catch(e => console.log(e));
                }
            };

            const toggleLecture = () => {
                const lecture = lectureAudioRef.current;
                if (isPlayingLecture) {
                    lecture.pause();
                } else {
                    speechAudioRef.current.pause();
                    lecture.play().catch(e => console.log(e));
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between p-2 md:p-6 max-w-7xl mx-auto">
                    
                    {/* Header 導覽頂欄 */}
                    <header className="flex flex-wrap items-center justify-between gap-4 bg-tribal-dark/95 p-4 rounded-2xl border-2 border-tribal-gold/50 backdrop-blur-md shadow-xl">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-tribal-red flex items-center justify-center border-2 border-tribal-gold shadow-md">
                                <i data-lucide="book-open" className="w-6 h-6 text-tribal-gold"></i>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold tracking-widest text-tribal-gold font-serif">mnanak na qalang</h1>
                                <p className="text-xs text-tribal-cream/70">繪畫：Zirong Chou ｜ 泰雅原住民 3D 雙頁互動電子書</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <button 
                                onClick={() => setIsAutoPlay(!isAutoPlay)}
                                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition shadow-md ${isAutoPlay ? 'bg-tribal-gold text-tribal-dark ring-2 ring-tribal-gold animate-pulse' : 'bg-tribal-brown text-tribal-cream border border-tribal-gold/30 hover:bg-tribal-red'}`}
                            >
                                <i data-lucide={isAutoPlay ? "sparkles" : "play-circle"} className="w-4 h-4"></i>
                                {isAutoPlay ? '自動說故事中' : '開啟自動說故事'}
                            </button>

                            <button 
                                onClick={() => setShowGuideModal(true)}
                                className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm bg-tribal-red hover:bg-tribal-accent border border-tribal-gold text-tribal-cream font-bold transition shadow-md"
                            >
                                <i data-lucide="github" className="w-4 h-4"></i>
                                GitHub 上傳指南
                            </button>
                        </div>
                    </header>

                    {/* 3D 雙頁繪本主區域 */}
                    <main className="my-4 flex-1 flex flex-col items-center justify-center relative perspective-2000 w-full">
                        <div className="w-full max-w-5xl aspect-[16/9] md:aspect-[2/1] bg-tribal-dark border-4 border-tribal-gold rounded-2xl book-shadow relative overflow-hidden flex shadow-2xl">
                            
                            {/* 原住民傳統幾何角邊裝飾 */}
                            <div className="absolute top-0 left-0 w-10 h-10 border-t-4 border-l-4 border-tribal-gold z-30 pointer-events-none"></div>
                            <div className="absolute top-0 right-0 w-10 h-10 border-t-4 border-r-4 border-tribal-gold z-30 pointer-events-none"></div>
                            <div className="absolute bottom-0 left-0 w-10 h-10 border-b-4 border-l-4 border-tribal-gold z-30 pointer-events-none"></div>
                            <div className="absolute bottom-0 right-0 w-10 h-10 border-b-4 border-r-4 border-tribal-gold z-30 pointer-events-none"></div>

                            {/* 左頁：繪本插圖照片 */}
                            <div className="w-1/2 h-full bg-black/90 relative border-r border-tribal-gold/30 flex items-center justify-center p-2 md:p-4 overflow-hidden">
                                <img 
                                    src={`assets/images/${pageData.img}`} 
                                    alt={pageData.title}
                                    className="max-w-full max-h-full object-contain rounded shadow-lg transition-all duration-300 hover:scale-105"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><rect width="600" height="600" fill="%234A2E1A"/><text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia" font-size="28" fill="%23D4AF37">${encodeURIComponent(pageData.title)}</text><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia" font-size="16" fill="%23F4EBE1">圖片路徑: assets/images/${pageData.img}</text></svg>`;
                                    }}
                                />
                                <div className="absolute bottom-2 inset-x-2 bg-tribal-dark/80 backdrop-blur-sm p-2 rounded text-center border border-tribal-gold/20">
                                    <span className="text-xs md:text-sm text-tribal-gold font-bold font-serif">{pageData.title}</span>
                                </div>
                            </div>

                            {/* 右頁：故事內文與獨立三聲軌控制 */}
                            <div className="w-1/2 h-full bg-tribal-brown/40 p-4 md:p-8 flex flex-col justify-between backdrop-blur-sm relative">
                                <div>
                                    <div className="flex items-center justify-between border-b-2 border-tribal-gold/30 pb-3 mb-4">
                                        <h2 className="text-base md:text-xl font-bold text-tribal-gold font-serif tracking-wide">{pageData.title}</h2>
                                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-tribal-red text-tribal-cream border border-tribal-gold">
                                            {currentPage + 1} / 20 頁
                                        </span>
                                    </div>

                                    <p className="text-xs md:text-base leading-relaxed text-tribal-cream font-serif my-4 bg-tribal-dark/40 p-4 rounded-xl border border-tribal-gold/20">
                                        {pageData.desc}
                                    </p>
                                </div>

                                {/* 多軌音訊控制器 */}
                                <div className="bg-tribal-dark/90 p-3 rounded-xl border border-tribal-gold/40 shadow-inner space-y-3">
                                    <div className="flex items-center justify-between text-xs font-bold text-tribal-gold uppercase tracking-wider">
                                        <span>原音與配樂播放控台</span>
                                        <button onClick={() => setIsMuted(!isMuted)} className="text-tribal-cream hover:text-tribal-gold transition">
                                            <i data-lucide={isMuted ? "volume-x" : "volume-2"} className="w-4 h-4"></i>
                                        </button>
                                    </div>

                                    {/* 3 個專屬聲音播放控制按鈕 */}
                                    <div className="grid grid-cols-3 gap-2">
                                        <button 
                                            onClick={toggleSpeech}
                                            className={`flex flex-col items-center justify-center p-2 rounded-lg text-xs font-bold transition border ${isPlayingSpeech ? 'bg-tribal-gold text-tribal-dark border-tribal-gold shadow-lg scale-105' : 'bg-tribal-brown/80 text-tribal-cream border-tribal-gold/30 hover:bg-tribal-red'}`}
                                        >
                                            <i data-lucide={isPlayingSpeech ? "pause" : "mic"} className="w-4 h-4 mb-1"></i>
                                            <span>故事朗讀</span>
                                        </button>

                                        <button 
                                            onClick={toggleLecture}
                                            className={`flex flex-col items-center justify-center p-2 rounded-lg text-xs font-bold transition border ${isPlayingLecture ? 'bg-tribal-gold text-tribal-dark border-tribal-gold shadow-lg scale-105' : 'bg-tribal-brown/80 text-tribal-cream border-tribal-gold/30 hover:bg-tribal-red'}`}
                                        >
                                            <i data-lucide={isPlayingLecture ? "pause" : "message-circle"} className="w-4 h-4 mb-1"></i>
                                            <span>故事講稿</span>
                                        </button>

                                        <button 
                                            onClick={toggleBgm}
                                            className={`flex flex-col items-center justify-center p-2 rounded-lg text-xs font-bold transition border ${isPlayingBgm ? 'bg-tribal-gold text-tribal-dark border-tribal-gold shadow-lg scale-105' : 'bg-tribal-brown/80 text-tribal-cream border-tribal-gold/30 hover:bg-tribal-red'}`}
                                        >
                                            <i data-lucide={isPlayingBgm ? "pause" : "music"} className="w-4 h-4 mb-1"></i>
                                            <span>主題配樂</span>
                                        </button>
                                    </div>

                                    <div className="text-xs text-tribal-gold/90 truncate flex items-center gap-1.5 pt-1">
                                        <i data-lucide="disc" className={`w-3.5 h-3.5 ${isPlayingBgm ? 'animate-spin' : ''}`}></i>
                                        <span>{pageData.musicDesc}</span>
                                    </div>

                                    {/* 音量調整滑軌 */}
                                    <div className="grid grid-cols-2 gap-3 pt-2 border-t border-tribal-gold/20 text-xs">
                                        <div className="flex items-center gap-2">
                                            <span className="text-tribal-cream/70">配樂</span>
                                            <input 
                                                type="range" min="0" max="1" step="0.05"
                                                value={bgmVolume}
                                                onChange={(e) => setBgmVolume(parseFloat(e.target.value))}
                                                className="w-full accent-tribal-gold cursor-pointer"
                                            />
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="text-tribal-cream/70">語音</span>
                                            <input 
                                                type="range" min="0" max="1" step="0.05"
                                                value={voiceVolume}
                                                onChange={(e) => setVoiceVolume(parseFloat(e.target.value))}
                                                className="w-full accent-tribal-gold cursor-pointer"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 中央書脊陰影效果 */}
                            <div className="absolute inset-y-0 left-1/2 w-8 -translate-x-1/2 book-spine-shadow z-20 pointer-events-none"></div>
                        </div>
                    </main>

                    {/* Footer Bottom Control Bar 底欄頁碼切換面板 */}
                    <footer className="bg-tribal-dark/95 border-2 border-tribal-gold/40 p-4 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                        
                        {/* 頁碼快速選單 */}
                        <div className="flex items-center gap-2">
                            <label className="text-sm font-bold text-tribal-gold">快速跳頁：</label>
                            <select 
                                value={currentPage}
                                onChange={(e) => changePage(parseInt(e.target.value))}
                                className="bg-tribal-brown border border-tribal-gold/60 text-tribal-cream rounded-xl px-3 py-1.5 text-sm font-medium focus:outline-none focus:border-tribal-gold"
                            >
                                {bookPages.map((page, idx) => (
                                    <option key={page.id} value={idx}>
                                        第 {page.id} 頁 - {page.title.split('：')[1] || page.title}
                                    </option>
                                ))}
                            </select>
                        </div>

                        {/* 翻頁切換按鈕 */}
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={() => changePage(currentPage - 1)}
                                disabled={currentPage === 0 || isFlipping}
                                className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold transition shadow-lg ${currentPage === 0 ? 'bg-tribal-brown/40 text-tribal-cream/30 cursor-not-allowed border border-tribal-gold/10' : 'bg-tribal-red hover:bg-tribal-accent text-tribal-cream border border-tribal-gold'}`}
                            >
                                <i data-lucide="chevron-left" className="w-5 h-5"></i>
                                上一頁
                            </button>

                            <span className="text-base font-bold tracking-widest text-tribal-gold font-serif px-2">
                                {currentPage + 1} / {bookPages.length}
                            </span>

                            <button 
                                onClick={() => changePage(currentPage + 1)}
                                disabled={currentPage === bookPages.length - 1 || isFlipping}
                                className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold transition shadow-lg ${currentPage === bookPages.length - 1 ? 'bg-tribal-brown/40 text-tribal-cream/30 cursor-not-allowed border border-tribal-gold/10' : 'bg-tribal-red hover:bg-tribal-accent text-tribal-cream border border-tribal-gold'}`}
                            >
                                下一頁
                                <i data-lucide="chevron-right" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {/* 20 頁縮圖選單按鈕 */}
                        <div className="hidden lg:flex items-center gap-1 overflow-x-auto max-w-xs py-1">
                            {bookPages.map((page, idx) => (
                                <button
                                    key={page.id}
                                    onClick={() => changePage(idx)}
                                    className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold transition ${currentPage === idx ? 'bg-tribal-gold text-tribal-dark scale-110 ring-2 ring-tribal-gold' : 'bg-tribal-brown text-tribal-cream opacity-60 hover:opacity-100'}`}
                                >
                                    {page.id}
                                </button>
                            ))}
                        </div>
                    </footer>

                    {/* GitHub 上傳與資料夾放置說明視窗 */}
                    {showGuideModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-tribal-dark border-2 border-tribal-gold rounded-2xl max-w-2xl w-full p-6 text-tribal-cream shadow-2xl max-h-[90vh] overflow-y-auto relative">
                                <button 
                                    onClick={() => setShowGuideModal(false)}
                                    className="absolute top-4 right-4 p-2 text-tribal-cream/70 hover:text-tribal-gold rounded-full transition"
                                >
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>

                                <div className="flex items-center gap-3 border-b border-tribal-gold/30 pb-3 mb-4">
                                    <i data-lucide="github" className="w-8 h-8 text-tribal-gold"></i>
                                    <div>
                                        <h3 className="text-xl font-bold text-tribal-gold">GitHub Pages 檔案放置與發布說明</h3>
                                        <p className="text-xs text-tribal-cream/70">請依照下面格式放置您的圖片與聲音檔案：</p>
                                    </div>
                                </div>

                                <div className="space-y-4 text-sm leading-relaxed">
                                    <div>
                                        <h4 className="font-bold text-tribal-gold mb-1">專案檔案目錄樹結構：</h4>
                                        <pre className="bg-black/70 p-3 rounded-xl border border-tribal-gold/30 text-xs font-mono text-tribal-gold overflow-x-auto">
{`your-repo-name/
├── index.html                  (本程式碼檔案)
└── assets/
    ├── images/                 (擺放所有照片檔)
    │   ├── 0.jpg (封面)
    │   ├── 1.jpg ~ 19.jpg
    │   └── spirit.png, left.jpg, right.jpg ...
    └── audio/                  (擺放所有 MP3 音訊檔)
        ├── speech0.mp3 ~ speech19.mp3 (朗讀音訊)
        ├── speech10.mp3 ~ speech19.mp3 (講稿音訊)
        └── music0.mp3 ~ music18.mp3, music9_2.mp3 (背景音樂)`}
                                        </pre>
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-tribal-gold mb-1">上傳步驟：</h4>
                                        <ol className="list-decimal list-inside space-y-1 text-xs text-tribal-cream/90">
                                            <li>將專案內容全部 Upload 到 GitHub 的新 Repository。</li>
                                            <li>進入 GitHub 該 Repository 的 Settings &gt; Pages。</li>
                                            <li>將 Branch 設為 <code className="text-tribal-gold">main</code> 並按 Save 儲存。稍等 1 分鐘即可順利在線上觀看！</li>
                                        </ol>
                                    </div>
                                </div>

                                <div className="mt-6 pt-4 border-t border-tribal-gold/20 flex justify-end">
                                    <button 
                                        onClick={() => setShowGuideModal(false)}
                                        className="px-6 py-2 bg-tribal-red hover:bg-tribal-accent text-tribal-cream font-bold rounded-xl transition border border-tribal-gold"
                                    >
                                        關閉說明 window
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 300);
    </script>
</body>
</html>
